apiVersion: v1
kind: Pod
metadata:
  name: gpu-memory-mib-annotation
  labels:
    kai.scheduler/queue: default-queue
  annotations:
    gpu-memory: "4096"
spec:
  schedulerName: kai-scheduler
  containers:
    - name: gpu-workload
      image: nvidia/cuda:13.0.2-base-ubi8
      command: ["nvidia-smi"]
      args: ["--query-gpu=name,utilization.gpu,utilization.memory,memory.total", "--format=csv,noheader"]

# Demo B - gang reclaim inside quota.
# 4 pods x 8 GPUs = 32 GPUs, exactly team-a's quota. No node has 8 free GPUs
# (each holds a healthcheck pod), so four background pods must be reclaimed
# before the gang can be placed.

apiVersion: batch/v1
kind: Job
metadata:
  name: team-a-gang
  annotations:
    kai.scheduler/batch-min-member: "4"
spec:
  parallelism: 4
  completions: 4
  backoffLimit: 0
  template:
    metadata:
      labels:
        kai.scheduler/queue: team-a
        app: user-workload
    spec:
      schedulerName: kai-scheduler
      priorityClassName: train
      restartPolicy: Never
      containers:
        - name: main
          image: ubuntu
          command: ["bash", "-c"]
          args: ["trap 'exit 0' TERM; sleep infinity & wait"]
          resources:
            limits:
              nvidia.com/gpu: "8"
            requests:
              cpu: 500m
              memory: 512M

# Background health-check pods: 8 replicas with required pod anti-affinity on
# hostname, so exactly one lands on each of the 8 GPU workers. Each holds 1 GPU,
# leaving 7 free per node - so any user pod asking for a whole node (8 GPUs)
# forces the background pod on that node to be reclaimed.
#
# Submitted to the `maintenance` queue with the low `maintenance` priority
# class, which makes their PodGroup preemptible.
#
# A Deployment rather than bare pods, both because that is the realistic shape
# for a health check and because it shows what happens after eviction: the
# replacement pod is recreated immediately and stays Pending, since the
# maintenance queue has overQuotaWeight 0 and gets nothing back.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcheck
spec:
  replicas: 8
  selector:
    matchLabels:
      app: healthcheck
  template:
    metadata:
      labels:
        app: healthcheck
        kai.scheduler/queue: maintenance
    spec:
      schedulerName: kai-scheduler
      priorityClassName: maintenance
      terminationGracePeriodSeconds: 5
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: healthcheck
              topologyKey: kubernetes.io/hostname
      containers:
        - name: main
          image: ubuntu
          command: ["bash", "-c"]
          args: ["trap 'exit 0' TERM; sleep infinity & wait"]
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              cpu: 100m
              memory: 128M

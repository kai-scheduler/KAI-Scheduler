# Two background pods per rack, each holding 1 GPU, each on a distinct node.
#
# Placement is driven by affinity rather than hostname pinning:
#   - nodeAffinity keeps each Deployment inside its rack
#   - podAntiAffinity on kubernetes.io/hostname (matching the shared
#     `app: healthcheck` label) keeps all four on separate nodes
#
# Result per rack: 2 nodes with 7 free GPUs, 2 nodes with 8 free GPUs.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcheck-rack-0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: healthcheck
      rack: rack-0
  template:
    metadata:
      labels:
        app: healthcheck
        rack: rack-0
        kai.scheduler/queue: maintenance
        kai.scheduler/background: "true"
    spec:
      schedulerName: kai-scheduler
      priorityClassName: maintenance
      terminationGracePeriodSeconds: 5
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: accelerator.nvidia.com/rack
                    operator: In
                    values: ["rack-0"]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: healthcheck
              topologyKey: kubernetes.io/hostname
      containers:
        - name: main
          image: ubuntu
          command: ["bash", "-c"]
          args: ["trap 'exit 0' TERM; sleep infinity & wait"]
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              cpu: 100m
              memory: 128M
---

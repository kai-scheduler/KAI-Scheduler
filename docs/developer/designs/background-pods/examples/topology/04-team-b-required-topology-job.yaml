# team-a asks for 4 full nodes (4 x 8 GPUs = 32 GPUs, exactly its quota) and
# prefers all pods inside a single rack.
#
# Each rack has only 2 fully-free nodes, because 2 nodes per rack hold a
# background pod. Allocate runs before reclaim and finds a feasible placement
# using the 4 fully-free nodes - 2 in each rack - so the job is admitted with a
# split-rack placement and reclaim is never attempted.
#
# The optimal placement (evict 2 background pods in one rack, take all 4 nodes
# there) is never explored.
#
# The PodGroup is declared explicitly so the topology constraint can be set;
# skip-podgrouper stops the podgrouper from creating a second one.

apiVersion: scheduling.run.ai/v2alpha2
kind: PodGroup
metadata:
  name: team-b-topology
  namespace: default
  labels:
    kai.scheduler/queue: team-b
spec:
  queue: team-a
  minMember: 4
  priorityClassName: train
  topologyConstraint:
    topology: network
    requiredTopologyLevel: rack
---
apiVersion: batch/v1
kind: Job
metadata:
  name: team-b-topology
  namespace: default
  annotations:
    kai.scheduler/skip-podgrouper: "true"
spec:
  parallelism: 4
  completions: 4
  backoffLimit: 0
  template:
    metadata:
      annotations:
        pod-group-name: team-b-topology
      labels:
        kai.scheduler/queue: team-b
        app: user-workload
    spec:
      schedulerName: kai-scheduler
      priorityClassName: train
      restartPolicy: Never
      containers:
        - name: main
          image: ubuntu
          command: ["bash", "-c"]
          args: ["trap 'exit 0' TERM; sleep infinity & wait"]
          resources:
            limits:
              nvidia.com/gpu: "8"
            requests:
              cpu: 500m
              memory: 512M

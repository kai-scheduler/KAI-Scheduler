suite: test binder.cdiEnabled Helm wiring

tests:
  - it: omits spec.binder.cdiEnabled by default so the operator can auto-detect
    templates:
      - kai-config.yaml
    set:
      kaiConfigDeployer.enabled: false
      kaiConfig.render: true
    asserts:
      - notExists:
          path: spec.binder.cdiEnabled

  - it: renders spec.binder.cdiEnabled true when binder.cdiEnabled is true
    templates:
      - kai-config.yaml
    set:
      kaiConfigDeployer.enabled: false
      kaiConfig.render: true
      binder.cdiEnabled: true
    asserts:
      - equal:
          path: spec.binder.cdiEnabled
          value: true

  - it: renders spec.binder.cdiEnabled false when binder.cdiEnabled is false
    templates:
      - kai-config.yaml
    set:
      kaiConfigDeployer.enabled: false
      kaiConfig.render: true
      binder.cdiEnabled: false
    asserts:
      - equal:
          path: spec.binder.cdiEnabled
          value: false

  - it: allows admission.cdi=false leftover from copied values without failing
    templates:
      - templates/validate.yaml
    set:
      admission.cdi: false
    asserts:
      - notFailedTemplate: {}

  - it: rejects admission.cdi=true and points at binder.cdiEnabled
    templates:
      - templates/validate.yaml
    set:
      admission.cdi: true
    asserts:
      - failedTemplate:
          errorMessage: "admission.cdi is not a valid Helm value; set binder.cdiEnabled instead. Leaving binder.cdiEnabled unset keeps ClusterPolicy auto-detection."

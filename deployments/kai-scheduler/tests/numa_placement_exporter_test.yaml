suite: test numa placement exporter configuration

set:
  kaiConfigDeployer:
    enabled: false
  kaiConfig:
    render: true
templates:
  - kai-config.yaml
tests:
  - it: should not set service.enabled by default (auto - follow shards)
    asserts:
      - notExists:
          path: spec.numaPlacementExporter.service.enabled
      - equal:
          path: spec.numaPlacementExporter.service.image.name
          value: numa-placement-exporter

  - it: should render service.enabled true when explicitly enabled
    set:
      numaPlacementExporter.enabled: true
    asserts:
      - equal:
          path: spec.numaPlacementExporter.service.enabled
          value: true

  - it: should render service.enabled false when explicitly disabled
    set:
      numaPlacementExporter.enabled: false
    asserts:
      - equal:
          path: spec.numaPlacementExporter.service.enabled
          value: false

  - it: should wire nodeSelector and tolerations onto the exporter
    set:
      numaPlacementExporter.nodeSelector:
        nvidia.com/gpu.present: "true"
      numaPlacementExporter.tolerations:
        - operator: Exists
    asserts:
      - equal:
          path: spec.numaPlacementExporter.nodeSelector["nvidia.com/gpu.present"]
          value: "true"
      - equal:
          path: spec.numaPlacementExporter.tolerations[0].operator
          value: Exists

  - it: should not render global.daemonsetsTolerations when the list is empty
    asserts:
      - notExists:
          path: spec.global.daemonsetsTolerations

  - it: should render global.daemonsetsTolerations onto spec.global
    set:
      global.daemonsetsTolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
    asserts:
      - equal:
          path: spec.global.daemonsetsTolerations[0].key
          value: nvidia.com/gpu
      - equal:
          path: spec.global.daemonsetsTolerations[0].operator
          value: Exists
      - equal:
          path: spec.global.daemonsetsTolerations[0].effect
          value: NoSchedule

  - it: should render global.daemonsetsTolerations independently of exporter tolerations
    set:
      global.daemonsetsTolerations:
        - key: dedicated
          operator: Equal
          value: gpu
          effect: NoSchedule
      numaPlacementExporter.tolerations:
        - operator: Exists
    asserts:
      - equal:
          path: spec.global.daemonsetsTolerations[0].key
          value: dedicated
      - equal:
          path: spec.global.daemonsetsTolerations[0].value
          value: gpu
      - equal:
          path: spec.numaPlacementExporter.tolerations[0].operator
          value: Exists

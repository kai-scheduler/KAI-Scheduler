name: KAI Scheduler - Pull Request
on:
  pull_request:
    types: [opened, reopened, synchronize]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.event_name == 'merge_group' && github.ref || github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check-build-and-test-required:
    name: Check if build and test are required
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      scale_tests: ${{ steps.filter.outputs.scale_tests }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: "every"
          filters: |
            docs:
              - '**/*.md'
              - 'docs/**'
              - '.changes/**'
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.changes/**'
            scale_tests:
              - 'docs/scale-tests/**'

  scale-tests-dashboard:
    needs: [ check-build-and-test-required ]
    if: needs.check-build-and-test-required.outputs.scale_tests == 'true'
    name: Test Scale Tests Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test dashboard
        run: node --test docs/scale-tests/*.test.js

  validate-and-test:
    needs: [ check-build-and-test-required ]
    if: needs.check-build-and-test-required.outputs.code == 'true'
    name: Validate & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache Go build cache (Docker-mounted)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build-docker-gocache
            ~/.cache/go-build-docker-gopath
          key: go-docker-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-docker-${{ runner.os }}-

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.3'
          cache: true

      - name: Run validation
        run: make validate

      - name: Run tests
        run: make test

      - name: Archive code coverage results
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage
          path: coverage/coverage.out

      - name: Calculate total coverage
        run: |
          if [ ! -s coverage/coverage.out ]; then
            exit 0
          fi

          COVERAGE=$(go tool cover -func=coverage/coverage.out | grep total | grep -Eo '[0-9]+\.[0-9]+')
          echo "$COVERAGE" > coverage/total-coverage.txt

      - name: Archive total coverage
        if: hashFiles('coverage/total-coverage.txt') != ''
        uses: actions/upload-artifact@v7
        with:
          name: total-coverage
          path: coverage/total-coverage.txt

  code-coverage-report:
    name: Code Coverage Report
    runs-on: ubuntu-latest
    needs: [ validate-and-test, check-build-and-test-required ]
    if: github.event_name != 'merge_group' && needs.check-build-and-test-required.outputs.code == 'true' && github.base_ref == 'main'
    steps:
      - uses: fgrosse/go-coverage-report@e432de98ee94a276e8f666d25bfd76347665f75b
        id: coverage_reporter
        with:
          coverage-artifact-name: "code-coverage"
          coverage-file-name: "coverage.out"
          root-package: "github.com/kai-scheduler/KAI-scheduler"
          github-baseline-workflow-ref: update-coverage-badge.yaml
          skip-comment: true
      - name: Download total coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: total-coverage
          path: coverage-summary
      - name: Download coverage badge branch
        uses: actions/checkout@v7
        with:
          ref: coverage-badge
          path: coverage-badge
      - name: Calculate coverage totals
        id: coverage_totals
        run: |
          PR_COVERAGE=$(cat coverage-summary/total-coverage.txt)
          echo "pr=$PR_COVERAGE" >> $GITHUB_OUTPUT

          BASELINE_COVERAGE=$(grep -oE '[0-9]+\.[0-9]+%' coverage-badge/badges/coverage.svg | head -1 | tr -d '%')
          echo "baseline=$BASELINE_COVERAGE" >> $GITHUB_OUTPUT

          DELTA=$(awk -v pr="$PR_COVERAGE" -v baseline="$BASELINE_COVERAGE" 'BEGIN { printf "%.2f", pr - baseline }')
          echo "delta=$DELTA" >> $GITHUB_OUTPUT
      - name: Save coverage report to file
        env:
          REPORT_BODY: ${{ steps.coverage_reporter.outputs.coverage_report }}
          BASELINE_COVERAGE: ${{ steps.coverage_totals.outputs.baseline }}
          PR_COVERAGE: ${{ steps.coverage_totals.outputs.pr }}
          COVERAGE_DELTA: ${{ steps.coverage_totals.outputs.delta }}
        run: |
          {
            echo "**Total coverage:** ${BASELINE_COVERAGE}% -> ${PR_COVERAGE}% (delta ${COVERAGE_DELTA}%)"
            if [ -n "$REPORT_BODY" ]; then
              echo ""
              echo "$REPORT_BODY"
            fi
          } > coverage-report.txt
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-for-comment
          path: coverage-report.txt
      - name: Save PR number
        run: echo "${{ github.event.number }}" > pr_number.txt
      - name: Upload PR number
        uses: actions/upload-artifact@v7
        with:
          name: pr-number-for-comment
          path: pr_number.txt

  build:
    needs: [ check-build-and-test-required ]
    if: needs.check-build-and-test-required.outputs.code == 'true'
    name: Build
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.package_version.outputs.PACKAGE_VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract package version
        id: package_version
        run: |
          GIT_REV=$(git rev-parse --short HEAD | sed 's/^0*//')
          PACKAGE_VERSION=0.0.0-$GIT_REV
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          echo $PACKAGE_VERSION

      - name: Cache Go build cache (Docker-mounted)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build-docker-gocache
            ~/.cache/go-build-docker-gopath
          key: go-docker-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-docker-${{ runner.os }}-

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.3'
          cache: true

      - name: Move Docker Data to /mnt
        run: |
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker-data
          echo '{"data-root": "/mnt/docker-data"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker info | grep "Docker Root Dir"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create image cache directory
        run: |
          sudo mkdir -p /mnt/images
          sudo chown -R $USER:$USER /mnt/images

      - name: Cache for docker images and helm chart
        uses: actions/cache@v6
        with:
          path: /mnt/images
          key:  images-${{ github.sha }}

      - name: Build docker images
        run: |
          make build DOCKER_BUILDX_ADDITIONAL_ARGS="--load --cache-from type=gha --cache-to type=gha,mode=max" VERSION=$PACKAGE_VERSION
          docker save $(docker images --format '{{.Repository}}:{{.Tag}}' | grep $PACKAGE_VERSION) | gzip > /mnt/images/docker_images.tgz

      - name: Build helm chart
        run: |
          helm dependency build ./deployments/kai-scheduler
          helm package ./deployments/kai-scheduler -d ./charts --app-version $PACKAGE_VERSION --version $PACKAGE_VERSION
          cp charts/kai-scheduler-$PACKAGE_VERSION.tgz /mnt/images/

  skip-build-and-test-message:
    name: Skip Build and Test Message
    needs: [ check-build-and-test-required ]
    if: needs.check-build-and-test-required.outputs.code != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Skip message
        run: |
          echo "Skipping build and test since only documentation files (.md or docs/) were changed."

  prepare-e2e-shards:
    name: Prepare E2E Shards
    needs: [ check-build-and-test-required ]
    if: needs.check-build-and-test-required.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Find E2E timing history
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -o pipefail

          mapfile -t report_runs < <(
            gh api "repos/$GH_REPO/actions/artifacts?per_page=100&page=1" \
              --jq '[.artifacts[] |
                select(.expired == false and (.name | startswith("e2e-report-")))] |
                group_by(.workflow_run.id) |
                map(max_by(.created_at)) |
                sort_by(.created_at) |
                reverse |
                .[].workflow_run.id' || true
          )
          history_index=0
          for run_id in "${report_runs[@]}"; do
            conclusion=$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.conclusion' 2>/dev/null || true)
            if [[ "$conclusion" != "success" ]]; then
              continue
            fi

            history_index=$(( history_index + 1 ))
            echo "run_$history_index=$run_id" >> "$GITHUB_OUTPUT"
            echo "Using E2E timing history from run $run_id"
            if (( history_index == 3 )); then
              break
            fi
          done
          echo "Found $history_index prior E2E runs with timing reports"

      - name: Download E2E timing history 1
        if: steps.history.outputs.run_1 != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: e2e-report-*
          path: ${{ runner.temp }}/e2e-history/1
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.history.outputs.run_1 }}

      - name: Download E2E timing history 2
        if: steps.history.outputs.run_2 != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: e2e-report-*
          path: ${{ runner.temp }}/e2e-history/2
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.history.outputs.run_2 }}

      - name: Download E2E timing history 3
        if: steps.history.outputs.run_3 != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: e2e-report-*
          path: ${{ runner.temp }}/e2e-history/3
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.history.outputs.run_3 }}

      - name: Discover and prepare E2E shards
        id: shards
        run: |
          set -o pipefail

          mapfile -t discovered < <(
            git grep -l 'RunSpecs(' -- 'test/e2e/suites/**/*_test.go' |
              xargs -n1 dirname |
              sort -u
          )

          declare -A dedicated=(
            ["test/e2e/suites/gitops"]=1
            ["test/e2e/suites/upgrade"]=1
          )
          declare -A discovered_packages=()
          main_packages=()
          for package in "${discovered[@]}"; do
            discovered_packages["$package"]=1
            if [[ -z "${dedicated[$package]:-}" ]]; then
              main_packages+=("$package")
            fi
          done

          for package in "${!dedicated[@]}"; do
            if [[ -z "${discovered_packages[$package]:-}" ]]; then
              echo "Dedicated E2E package was not discovered: $package"
              exit 1
            fi
          done
          if (( ${#main_packages[@]} < 3 )); then
            echo "At least three main E2E packages are required"
            exit 1
          fi

          seed=$(( (GITHUB_RUN_ID * 100 + GITHUB_RUN_ATTEMPT) % 2147483647 ))
          if (( seed == 0 )); then
            seed=1
          fi

          history_root="$RUNNER_TEMP/e2e-history"
          downloaded_runs=0
          for history_index in 1 2 3; do
            mapfile -t run_reports < <(
              find "$history_root/$history_index" -type f -name 'e2e-report-*.json' 2>/dev/null | sort
            )
            if (( ${#run_reports[@]} == 0 )); then
              continue
            fi
            downloaded_runs=$(( downloaded_runs + 1 ))
          done

          declare -A duration_sum=()
          declare -A duration_count=()
          mapfile -t historical_reports < <(find "$history_root" -type f -name 'e2e-report-*.json' | sort)
          for report in "${historical_reports[@]}"; do
            while IFS=$'\t' read -r package seconds; do
              if [[ -z "${discovered_packages[$package]:-}" || -n "${dedicated[$package]:-}" ]]; then
                continue
              fi
              duration_sum["$package"]=$(( ${duration_sum[$package]:-0} + seconds ))
              duration_count["$package"]=$(( ${duration_count[$package]:-0} + 1 ))
            done < <(
              jq -r '.[] |
                select(.SuitePath | contains("test/e2e/suites/")) |
                [
                  (.SuitePath | capture(".*/(?<path>test/e2e/suites/.*)$").path),
                  ((.RunTime / 1000000000) | ceil)
                ] | @tsv' "$report" 2>/dev/null || true
            )
          done

          declare -A weights=()
          observed_weights=()
          for package in "${main_packages[@]}"; do
            if [[ -n "${duration_count[$package]:-}" ]]; then
              weight=$((
                (duration_sum[$package] + duration_count[$package] - 1) /
                duration_count[$package] + 1
              ))
              weights["$package"]="$weight"
              observed_weights+=("$weight")
            fi
          done

          default_weight=1
          if (( ${#observed_weights[@]} > 0 )); then
            mapfile -t observed_weights < <(printf '%s\n' "${observed_weights[@]}" | sort -n)
            default_weight=${observed_weights[$(( ${#observed_weights[@]} / 2 ))]}
          fi
          for package in "${main_packages[@]}"; do
            if [[ -z "${weights[$package]:-}" ]]; then
              weights["$package"]=$(( default_weight * 2 ))
              echo "No historical duration for $package; using conservative weight ${weights[$package]}"
            fi
          done

          total_weight=0
          largest_weight=0
          for package in "${main_packages[@]}"; do
            total_weight=$(( total_weight + weights[$package] ))
            if (( weights[$package] > largest_weight )); then
              largest_weight=${weights[$package]}
            fi
          done
          ideal_load=$(( (total_weight + 2) / 3 ))
          target_load=$(( (ideal_load * 110 + 99) / 100 ))
          if (( largest_weight > target_load )); then
            target_load=$largest_weight
          fi

          best_load=$total_weight
          best_candidate=-1
          best_shard_1=()
          best_shard_2=()
          best_shard_3=()
          selected_candidate=-1
          for candidate in $(seq 0 199); do
            mapfile -t shuffled < <(
              for package in "${main_packages[@]}"; do
                digest=$(printf '%s:%s:%s' "$seed" "$candidate" "$package" | git hash-object --stdin)
                printf '%s\t%s\n' "$digest" "$package"
              done | sort | cut -f2-
            )

            candidate_loads=(0 0 0)
            candidate_shard_1=()
            candidate_shard_2=()
            candidate_shard_3=()
            package_index=0
            for package in "${shuffled[@]}"; do
              target=$(( (seed + candidate + package_index) % 3 ))
              for shard_index in 0 1 2; do
                if (( candidate_loads[shard_index] < candidate_loads[target] )); then
                  target=$shard_index
                fi
              done

              case "$target" in
                0) candidate_shard_1+=("$package") ;;
                1) candidate_shard_2+=("$package") ;;
                2) candidate_shard_3+=("$package") ;;
              esac
              candidate_loads[target]=$(( candidate_loads[target] + weights[$package] ))
              package_index=$(( package_index + 1 ))
            done

            candidate_max=${candidate_loads[0]}
            for shard_index in 1 2; do
              if (( candidate_loads[shard_index] > candidate_max )); then
                candidate_max=${candidate_loads[shard_index]}
              fi
            done

            if (( candidate_max < best_load )); then
              best_load=$candidate_max
              best_candidate=$candidate
              best_loads=("${candidate_loads[@]}")
              best_shard_1=("${candidate_shard_1[@]}")
              best_shard_2=("${candidate_shard_2[@]}")
              best_shard_3=("${candidate_shard_3[@]}")
            fi
            if (( candidate_max <= target_load )); then
              selected_candidate=$candidate
              loads=("${candidate_loads[@]}")
              shard_1=("${candidate_shard_1[@]}")
              shard_2=("${candidate_shard_2[@]}")
              shard_3=("${candidate_shard_3[@]}")
              break
            fi
          done

          if (( selected_candidate == -1 )); then
            selected_candidate=$best_candidate
            loads=("${best_loads[@]}")
            shard_1=("${best_shard_1[@]}")
            shard_2=("${best_shard_2[@]}")
            shard_3=("${best_shard_3[@]}")
          fi

          declare -A assignment_count=()
          for package in "${shard_1[@]}" "${shard_2[@]}" "${shard_3[@]}"; do
            assignment_count["$package"]=$(( ${assignment_count[$package]:-0} + 1 ))
          done
          for package in "${main_packages[@]}"; do
            if [[ "${assignment_count[$package]:-0}" != 1 ]]; then
              echo "E2E package must be assigned exactly once: $package"
              exit 1
            fi
          done

          printf 'E2E shard seed: %s; candidate: %s; historical runs: %s\n' \
            "$seed" "$selected_candidate" "$downloaded_runs"
          printf 'shard-1 (weight %s):\n' "${loads[0]}"
          printf '  %s\n' "${shard_1[@]}"
          printf 'shard-2 (weight %s):\n' "${loads[1]}"
          printf '  %s\n' "${shard_2[@]}"
          printf 'shard-3 (weight %s):\n' "${loads[2]}"
          printf '  %s\n' "${shard_3[@]}"

          shard_1_json=$(printf '%s\n' "${shard_1[@]}" | jq -R . | jq -s .)
          shard_2_json=$(printf '%s\n' "${shard_2[@]}" | jq -R . | jq -s .)
          shard_3_json=$(printf '%s\n' "${shard_3[@]}" | jq -R . | jq -s .)
          matrix=$(jq -cn \
            --arg seed "$seed" \
            --argjson shard_1 "$shard_1_json" \
            --argjson shard_2 "$shard_2_json" \
            --argjson shard_3 "$shard_3_json" \
            '{include: [
              {shard: "shard-1", seed: $seed, packages: ($shard_1 | map("./" + .) | join(" "))},
              {shard: "shard-2", seed: $seed, packages: ($shard_2 | map("./" + .) | join(" "))},
              {shard: "shard-3", seed: $seed, packages: ($shard_3 | map("./" + .) | join(" "))}
            ]}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  e2e-tests:
    name: Run E2E Tests (${{ matrix.shard }})
    needs: [ build, check-build-and-test-required, prepare-e2e-shards ]
    if: needs.check-build-and-test-required.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-e2e-shards.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup e2e cluster
        uses: ./.github/actions/setup-e2e-cluster
        with:
          package_version: ${{ needs.build.outputs.package_version }}
          deploy_prometheus: 'false'

      - name: Install KAI-scheduler
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
        run: |
          helm upgrade -i kai-scheduler /mnt/images/kai-scheduler-$PACKAGE_VERSION.tgz -n kai-scheduler --create-namespace \
            --values ./hack/kai-scheduler-fake-npe-values.yaml \
            --set "global.gpuSharing=true" --set "global.registry=localhost:30100" --set "prometheus.enabled=false" --debug --wait
          kubectl create clusterrole pods-patcher --verb=patch --resource=pods
          kubectl create rolebinding fake-status-updater --clusterrole=pods-patcher --serviceaccount=gpu-operator:status-updater -n kai-resource-reservation

      - name: Run e2e tests
        env:
          E2E_PACKAGES: ${{ matrix.packages }}
          E2E_REPORT: e2e-report-${{ matrix.shard }}.json
          E2E_SEED: ${{ matrix.seed }}
        run: |
          read -r -a packages <<< "$E2E_PACKAGES"
          go tool ginkgo -r --keep-going --randomize-all --randomize-suites --seed="$E2E_SEED" --trace -vv --label-filter '!autoscale && !scale && !upgrade && !gitops && !nightly' --output-dir=. --json-report="$E2E_REPORT" "${packages[@]}"

      - name: Report skipped tests
        if: always()
        env:
          E2E_REPORT: e2e-report-${{ matrix.shard }}.json
        run: |
          echo "=== Skipped Tests ==="
          if [[ ! -f "$E2E_REPORT" ]]; then
            echo "No E2E report was produced"
            exit 0
          fi
          jq -r '.[].SpecReports[] | select(.State == "skipped") | ([.ContainerHierarchyTexts[], .LeafNodeText] | join(" > "))' "$E2E_REPORT" || echo "No skipped tests found"

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.shard }}
          path: e2e-report-${{ matrix.shard }}.json
          if-no-files-found: warn

      - name: Uninstall KAI-scheduler
        if: always()
        run: |
          if ! kubectl cluster-info >/dev/null 2>&1; then
            echo "The cluster is unavailable; the Kind post-step will remove any remaining resources."
            exit 0
          fi
          if ! helm status kai-scheduler -n kai-scheduler >/dev/null 2>&1; then
            echo "KAI-scheduler is not installed; the Kind post-step will remove the cluster."
            exit 0
          fi

          helm uninstall kai-scheduler -n kai-scheduler
          echo "Waiting up to 60 seconds for pods to terminate..."
          if ! kubectl get namespace kai-scheduler >/dev/null 2>&1; then
            exit 0
          fi
          for i in {1..12}; do
            NON_TERM=$(kubectl get pods -n kai-scheduler --no-headers | awk '!/Terminating/ && !/prometheus/ { count++ } END { print count + 0 }')
            if [ "$NON_TERM" -eq 0 ]; then
              echo "Only Terminating pods remain or no pods are left. Safe to proceed."
              exit 0
            fi
            echo "Found $NON_TERM non-terminating pods... waiting (attempt $i/12)"
            sleep 5
          done
          echo "Pods did not terminate within 60 seconds. Uninstall incomplete."
          exit 1

  e2e-upgrade-tests:
    name: Run E2E Upgrade Tests
    needs: [ build, check-build-and-test-required ]
    if: needs.check-build-and-test-required.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve upgrade-from version
        id: resolve_version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET_BRANCH="${{ github.base_ref }}"
          if [[ "$TARGET_BRANCH" =~ v([0-9]+)\.([0-9]+) ]]; then
            # Version branch: upgrade from the latest published release of the previous minor
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            if [ "$MINOR" -eq 0 ]; then
              echo "No previous minor version exists. Skipping upgrade tests."
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
            PREV_MINOR="${MAJOR}.$((MINOR - 1))"
            CANDIDATES=$(gh release list --limit 200 --json tagName -q '.[].tagName' | grep -E "^v${PREV_MINOR}\.[0-9]+$" | sort -rV)
            if [ -z "$CANDIDATES" ]; then
              echo "No release found for v${PREV_MINOR}.x. Skipping upgrade tests."
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          else
            # Main branch: upgrade from the latest published release
            CANDIDATES=$(gh release list --limit 200 --json tagName -q '.[].tagName' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -rV)
            if [ -z "$CANDIDATES" ]; then
              echo "No releases found. Skipping upgrade tests."
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          UPGRADE_FROM=""
          while IFS= read -r CANDIDATE; do
            echo "Checking whether chart $CANDIDATE is published to ghcr..."
            if helm show chart "oci://ghcr.io/kai-scheduler/kai-scheduler/kai-scheduler" --version "$CANDIDATE" >/dev/null 2>&1; then
              UPGRADE_FROM="$CANDIDATE"
              break
            fi
            echo "Chart for $CANDIDATE not yet available in ghcr, trying the next candidate..."
          done <<< "$CANDIDATES"

          if [ -z "$UPGRADE_FROM" ]; then
            echo "No candidate release has a published chart yet (release workflow may still be running). Skipping upgrade tests."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Upgrading from $UPGRADE_FROM"
          echo "upgrade_from=$UPGRADE_FROM" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Setup e2e cluster
        if: steps.resolve_version.outputs.skip != 'true'
        uses: ./.github/actions/setup-e2e-cluster
        with:
          package_version: ${{ needs.build.outputs.package_version }}

      - name: Install previous version of KAI-scheduler
        if: steps.resolve_version.outputs.skip != 'true'
        env:
          UPGRADE_FROM_VERSION: ${{ steps.resolve_version.outputs.upgrade_from }}
        run: |
          echo "Installing kai-scheduler $UPGRADE_FROM_VERSION from OCI registry..."
          helm upgrade -i kai-scheduler oci://ghcr.io/kai-scheduler/kai-scheduler/kai-scheduler -n kai-scheduler --create-namespace \
            --set "global.gpuSharing=true" --wait --version "$UPGRADE_FROM_VERSION"
          kubectl create clusterrole pods-patcher --verb=patch --resource=pods
          kubectl create rolebinding fake-status-updater --clusterrole=pods-patcher --serviceaccount=gpu-operator:status-updater -n kai-resource-reservation

      - name: Run upgrade e2e tests
        if: steps.resolve_version.outputs.skip != 'true'
        env:
          UPGRADE_CHART_PATH: /mnt/images/kai-scheduler-${{ needs.build.outputs.package_version }}.tgz
        run: |
          go tool ginkgo -r --keep-going --trace -vv --label-filter 'upgrade' --output-dir=. --json-report=e2e-upgrade-report.json ./test/e2e/suites/upgrade

  e2e-gitops-tests:
    name: Run E2E GitOps Tests
    needs: [ build, check-build-and-test-required ]
    if: needs.check-build-and-test-required.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup e2e cluster
        uses: ./.github/actions/setup-e2e-cluster
        with:
          package_version: ${{ needs.build.outputs.package_version }}

      - name: Install ArgoCD and in-cluster chart repo
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
        run: |
          ./hack/setup-gitops-e2e.sh --chart-tgz /mnt/images/kai-scheduler-$PACKAGE_VERSION.tgz

      - name: Run gitops e2e tests
        env:
          GITOPS_CHART_VERSION: ${{ needs.build.outputs.package_version }}
          # CI images are pushed to the in-cluster registry by setup-e2e-cluster
          GITOPS_KAI_REGISTRY: localhost:30100
        run: |
          go tool ginkgo -r --keep-going --trace -vv --label-filter 'gitops' --output-dir=. --json-report=e2e-gitops-report.json ./test/e2e/suites/gitops

  e2e-gate:
    name: E2E Gate
    needs:
      - check-build-and-test-required
      - prepare-e2e-shards
      - e2e-tests
      - e2e-upgrade-tests
      - e2e-gitops-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check E2E results
        env:
          CHECK_RESULT: ${{ needs.check-build-and-test-required.result }}
          CODE_REQUIRED: ${{ needs.check-build-and-test-required.outputs.code }}
          PREPARE_RESULT: ${{ needs.prepare-e2e-shards.result }}
          MAIN_RESULT: ${{ needs.e2e-tests.result }}
          UPGRADE_RESULT: ${{ needs.e2e-upgrade-tests.result }}
          GITOPS_RESULT: ${{ needs.e2e-gitops-tests.result }}
        run: |
          if [[ "$CHECK_RESULT" != "success" ]]; then
            echo "The change-detection job did not succeed."
            exit 1
          fi
          if [[ "$CODE_REQUIRED" == "false" ]]; then
            echo "E2E tests are not required for this documentation-only change."
            exit 0
          fi
          if [[ "$CODE_REQUIRED" != "true" ]]; then
            echo "The change-detection job returned an unexpected code result: $CODE_REQUIRED"
            exit 1
          fi

          failures=0
          results=(
            "Prepare E2E Shards:$PREPARE_RESULT"
            "Main E2E Shards:$MAIN_RESULT"
            "Upgrade E2E:$UPGRADE_RESULT"
            "GitOps E2E:$GITOPS_RESULT"
          )
          for result_entry in "${results[@]}"; do
            job_name=${result_entry%%:*}
            job_result=${result_entry#*:}
            if [[ "$job_result" != "success" ]]; then
              echo "$job_name did not succeed: $job_result"
              failures=$((failures + 1))
            fi
          done

          if [[ "$failures" -ne 0 ]]; then
            exit 1
          fi
          echo "All E2E jobs passed."

  # Keep the existing required check available until the ruleset uses E2E Gate.
  e2e-legacy-required-check:
    name: Run E2E Tests
    needs: [ e2e-gate ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check E2E gate
        env:
          E2E_GATE_RESULT: ${{ needs.e2e-gate.result }}
        run: |
          if [[ "$E2E_GATE_RESULT" != "success" ]]; then
            echo "E2E Gate did not succeed: $E2E_GATE_RESULT"
            exit 1
          fi
          echo "E2E Gate passed."

  cleanup-images-cache:
    name: Cleanup Images Cache
    needs: [ e2e-tests, e2e-upgrade-tests, e2e-gitops-tests, check-build-and-test-required ]
    # No always(): a failed e2e job must keep the cache so "Re-run failed
    # jobs" can restore images; stale entries fall to GitHub cache eviction.
    if: success() && needs.check-build-and-test-required.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete images cache
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache delete "images-${{ github.sha }}" --repo ${{ github.repository }}

  fossa-validate:
    needs: [ build, check-build-and-test-required ]
    if: needs.check-build-and-test-required.outputs.code == 'true'
    name: FOSSA license check
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # push-only token, intentional; see https://github.com/fossa-contrib/fossa-action?tab=readme-ov-file#push-only-api-token
      FOSSA_API_KEY: 577e3d21c48454822ae8ea496209a505 # This is a push-only token that is safe to be exposed.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run FOSSA analysis and validate status
        uses: fossa-contrib/fossa-action@v4.0.0
        with:
          fossa-api-key: ${{ env.FOSSA_API_KEY }}
          skip-test: false

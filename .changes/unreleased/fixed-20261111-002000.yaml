kind: Fixed
body: |-
  A pod that requests a GPU resource (nvidia.com/gpu or amd.com/gpu) is no longer bound to a node whose GPUs come only from DRA when no DeviceClass maps that resource to DRA. Before, it ran without a GPU. It now stays Pending with a clear reason

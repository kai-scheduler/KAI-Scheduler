kind: Added
body: FullNodeFirst reclaim scenario generator. For a pending workload that needs a whole node, it proposes a node-scoped "free this node" victim set for the first reclaimable node it finds, so reclaim finds a scenario in near-constant time on large clusters instead of searching victim combinations.
